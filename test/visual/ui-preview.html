<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rat Detective · UI workshop</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    #ui-panel{position:fixed;z-index:1000;top:50%;left:50%;translate:-50% -50%;width:250px;max-height:70vh;overflow:auto;padding:10px;background:#1a1222f2;border-left:3px solid #cfb477;color:#f3e9d5;font:13px/1.4 system-ui,sans-serif}
    #ui-panel.docked{top:auto;bottom:8px;left:auto;right:8px;translate:none;max-height:40vh}
    #ui-panel.hidden{display:none}
    #ui-panel button{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;border:1px solid #796580;background:#302039;color:#f3e9d5;padding:4px 8px;margin:3px 0}
  </style>
</head>
<body>
  <div id="title-screen">
    <button type="button" id="title-settings-btn">⚙ Settings</button>
    <div class="title-folder">
      <div class="logo-container">
        <img src="/logo-title.webp" alt="Rat Detective Logo" id="main-logo" width="600" height="600">
        <div class="title-group"><h1><span>Rat</span> Detective</h1></div>
      </div>
      <p class="title-typed" aria-hidden="true">DETECTIVE ON RECORD:</p>
      <div class="name-input-group">
        <div id="player-name">Inspector Brie</div>
        <button type="button" id="reroll-name-btn" aria-label="Roll another name"><svg viewBox="0 0 28 24" aria-hidden="true"><rect x="10.5" y="1.5" width="16" height="16" rx="3" fill="#07040a" stroke="currentColor" stroke-width="1.5"/><rect x="1.5" y="6.5" width="16" height="16" rx="3" fill="#07040a" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <button id="enter-city-btn"><div class="pulse-dot"></div><span id="enter-city-label">ENTER CITY!</span></button>
    </div>
    <p class="music-credit game-credit">Music: <a id="music-credit-link" href="https://www.youtube.com/watch?v=k4hjX6ZsplU" target="_blank" rel="noopener noreferrer">Rat Detective Boogie</a> by Stellar Cruise</p>
  </div>
  <div id="kill-feed"></div>
  <div id="victory-overlay"><div id="victory-text"></div></div>
  <div id="respawn-overlay">
    <div class="death-burst" aria-hidden="true">POW!</div>
    <div class="respawn-label">RAT DOWN!</div>
    <div id="respawn-note" class="respawn-note">A MINOR CAREER SETBACK.</div>
    <div class="respawn-count"><span id="respawn-clock" class="respawn-clock" aria-hidden="true"><i></i></span>BACK IN <span id="respawn-timer">3</span></div>
  </div>
  <div id="crosshair"></div>
  <div id="hud">WASD — Move | Mouse — Look | Space — Jump | LMB — Shoot | Hold Tab — Scoreboard | Esc — Settings</div>
  <div id="creator-credit" class="game-credit">Made by <a id="creator-credit-link" href="https://tylermayberry.dev" target="_blank" rel="noopener noreferrer">Tyler Mayberry</a></div>
  <aside id="ui-panel"><strong>UI WORKSHOP</strong><div id="ui-buttons"></div></aside>
  <script type="module" src="./ui-preview.ts"></script>
</body>
</html>
