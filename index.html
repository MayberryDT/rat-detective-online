<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rat Detective Online</title>
    <meta name="description" content="Grab the Hot Case, sling ricocheting cheese balls, and send rival rats flying. A chaotic multiplayer shooter in a run-down noir city. Play free in your browser." />
    <link rel="canonical" href="https://ratdetective.online/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rat Detective" />
    <meta property="og:title" content="Rat Detective — Cheese. Crime. Chaos." />
    <meta property="og:description" content="Grab the Hot Case, sling ricocheting cheese balls, and send rival rats flying. A chaotic multiplayer shooter in a run-down noir city. Play free in your browser." />
    <meta property="og:url" content="https://ratdetective.online/" />
    <meta property="og:image" content="https://ratdetective.online/share-title-v1.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Rat Detective title screen, with its detective rat logo against the dark purple city backdrop." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rat Detective — Cheese. Crime. Chaos." />
    <meta name="twitter:description" content="Grab the Hot Case, sling ricocheting cheese balls, and send rival rats flying. A chaotic multiplayer shooter in a run-down noir city. Play free in your browser." />
    <meta name="twitter:image" content="https://ratdetective.online/share-title-v1.png" />
    <meta name="twitter:image:alt" content="The Rat Detective title screen, with its detective rat logo against the dark purple city backdrop." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
    <!-- Title Screen -->
    <div id="title-screen">
        <div class="title-kicker">DEPARTMENT OF BAD IDEAS PRESENTS</div>
        <div class="logo-container">
            <img src="/logo.png" alt="Rat Detective Logo" id="main-logo">
            <div class="title-group">
                <h1><span>Rat</span> Detective</h1>
            </div>
        </div>
        <div class="name-input-group">
            <div id="player-name"></div>
            <button type="button" id="reroll-name-btn" aria-label="Roll another name">
                <svg viewBox="0 0 28 24" aria-hidden="true">
                    <rect x="10.5" y="1.5" width="16" height="16" rx="3" fill="#07040a" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="15.5" cy="6.5" r="1.15" fill="currentColor"/>
                    <circle cx="21.5" cy="6.5" r="1.15" fill="currentColor"/>
                    <circle cx="18.5" cy="9.5" r="1.15" fill="currentColor"/>
                    <circle cx="15.5" cy="12.5" r="1.15" fill="currentColor"/>
                    <circle cx="21.5" cy="12.5" r="1.15" fill="currentColor"/>
                    <rect x="1.5" y="6.5" width="16" height="16" rx="3" fill="#07040a" stroke="currentColor" stroke-width="1.5"/>
                    <circle cx="5.5" cy="11.5" r="1.15" fill="currentColor"/>
                    <circle cx="13.5" cy="11.5" r="1.15" fill="currentColor"/>
                    <circle cx="9.5" cy="14.5" r="1.15" fill="currentColor"/>
                    <circle cx="5.5" cy="17.5" r="1.15" fill="currentColor"/>
                    <circle cx="13.5" cy="17.5" r="1.15" fill="currentColor"/>
                </svg>
            </button>
        </div>

        <button id="enter-city-btn" disabled autofocus>
            <div class="pulse-dot"></div>
            ENTER CITY!
        </button>
    </div>

    <!-- Kill Feed -->
    <div id="kill-feed"></div>

    <!-- Victory Overlay -->
    <div id="victory-overlay">
        <div id="victory-text"></div>
    </div>

    <!-- Respawn Countdown -->
    <div id="respawn-overlay">
        <div class="death-burst" aria-hidden="true">POW!</div>
        <div class="respawn-label">RAT DOWN!</div>
        <div class="respawn-note">A MINOR CAREER SETBACK.</div>
        <div class="respawn-count">BACK IN <span id="respawn-timer">3</span></div>
    </div>

    <!-- Crosshair -->
    <div id="crosshair"></div>

    <!-- HUD -->
    <div id="hud">
        <div>WASD — Move &nbsp;|&nbsp; Mouse — Look &nbsp;|&nbsp; Space — Jump &nbsp;|&nbsp; LMB — Shoot &nbsp;|&nbsp;
            Close the case to win.</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
